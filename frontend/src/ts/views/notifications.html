<section class="page-shell notifications-page">
  <div class="page-heading"><div><p class="eyebrow">NOTIFICATIONS</p><h1>Recent alerts.</h1><p class="muted">Newest first. Open an unread notification to mark it as read.</p></div><button type="button" class="secondary-button notification-mark-all" data-bind="click: markAllRead, disable: markingAll() || unreadCount() === 0"><span data-bind="text: markingAll() ? &quot;Marking…&quot; : &quot;Mark all as read&quot;"></span></button></div>
  <div class="alert alert-error" data-bind="visible: error"><span data-bind="text: error"></span></div>
  <div class="loading-block" data-bind="visible: loading">Loading notifications…</div>
  <section class="content-card notification-panel" data-bind="visible: !loading()"><div class="notification-summary" data-bind="visible: unreadCount()"><strong data-bind="text: unreadCount() + &quot; unread notification(s)&quot;"></strong><span>Select an alert to mark it as read.</span></div><div class="notification-list" data-bind="foreach: orderedNotifications"><button type="button" class="notification-item" data-bind="click: () => $parent.markRead($data), disable: read || $parent.markingId() === notificationId, css: { &quot;is-unread&quot;: !read, &quot;is-updating&quot;: $parent.markingId() === notificationId }"><span class="notification-indicator" aria-hidden="true"></span><span class="notification-content"><span class="notification-type" data-bind="text: eventType"></span><span class="notification-message" data-bind="text: message"></span><time data-bind="text: $parent.formattedDate(createdAt)"></time></span><span class="status-pill" data-bind="text: read ? &quot;Read&quot; : ($parent.markingId() === notificationId ? &quot;Updating…&quot; : &quot;Mark as read&quot;), css: read ? &quot;read&quot; : &quot;unread&quot;"></span></button></div><p class="empty-state" data-bind="visible: notifications().length === 0">You do not have any notifications yet.</p></section>
</section>
