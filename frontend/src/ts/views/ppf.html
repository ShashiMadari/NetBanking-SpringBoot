
<section class="page-shell investment-category-page"><div class="page-heading"><div><p class="eyebrow" data-bind="text: eyebrow"></p><h1 data-bind="text: heading"></h1><p class="muted" data-bind="text: description"></p></div><a class="secondary-button" href="?ojr=investments">Back to Investments</a></div><div class="alert alert-error" data-bind="visible: error"><span data-bind="text: error"></span></div><div class="alert alert-success" data-bind="visible: notice"><span data-bind="text: notice"></span></div><div class="loading-block" data-bind="visible: loading">Loading investment options…</div><section class="content-card" data-bind="visible: !loading()"><p class="eyebrow">AVAILABLE OPTIONS</p><div class="investment-options-grid" data-bind="foreach: categoryProducts"><button type="button" class="investment-option-card" data-bind="click: () => $parent.chooseProduct($data), css: { selected: $parent.selectedProductId() === id }"><strong data-bind="text: name"></strong><span data-bind="text: $parent.productDetails($data)"></span><small data-bind="text: riskLevel ? riskLevel + ' risk profile' : 'Secure investment option'"></small></button></div></section><section class="content-card order-panel" data-bind="visible: selectedProduct"><p class="eyebrow">MAKE AN INVESTMENT</p><h2 data-bind="text: selectedProduct() ? selectedProduct().name : ''"></h2><div class="form-row"><label>Paying account<select data-bind="options: accounts, optionsText: accountLabel, optionsValue: 'accountId', value: purchaseAccountId"></select></label><label data-bind="visible: isMutualFund">Investment type<select data-bind="value: investmentMode"><option value="LUMPSUM">Lump sum</option><option value="SIP">Start SIP</option></select></label><label>Amount (INR)<input type="number" min="1" step="1" data-bind="value: investmentAmount" /></label><button type="button" class="primary-button" data-bind="click: submitInvestment, text: orderLabel"></button></div><p class="muted">Your account debit is processed after OTP authorisation.</p><div class="otp-row" data-bind="visible: purchase.orderId"><label>Six-digit purchase OTP<input inputmode="numeric" maxlength="6" autocomplete="one-time-code" data-bind="value: purchase.otp" /></label><button type="button" class="secondary-button" data-bind="click: authorisePurchase, disable: purchase.busy">Authorise purchase</button></div></section></section>
