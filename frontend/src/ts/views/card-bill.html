<section class="page-shell"><div class="page-heading"><div><p class="eyebrow">CREDIT CARD REPAYMENT</p><h1>Pay your card bill.</h1><p class="muted">Choose the card and bank account to debit.</p></div><a class="secondary-button" href="?ojr=cards">Back to Cards</a></div><div class="alert alert-error" data-bind="visible:error"><span data-bind="text:error"></span></div><div class="alert alert-success" data-bind="visible:notice"><span data-bind="text:notice"></span></div><section class="content-card"><div class="form-row"><label>Credit card<select data-bind="options:cards,optionsText:cardLabel,optionsValue:'cardId',value:selectedCardId"></select></label><label>Pay from account<select data-bind="options:accounts,optionsText:accountLabel,optionsValue:'accountId',value:selectedAccountId"></select></label></div><div data-bind="with:selectedCard"><p class="muted" data-bind="text:'Outstanding balance: INR '+outstandingAmount"></p><p class="muted" data-bind="text:'Available for regular card-bill payment: INR '+$parent.convertibleAmount().toLocaleString('en-IN',{minimumFractionDigits:2})"></p><p class="muted" data-bind="text:'Minimum due: INR '+minimumDueAmount+' · Due date: '+(paymentDueDate || 'Not set')"></p></div><div class="form-row"><label>Repayment amount (INR)<input type="number" min="1" data-bind="value:amount"/></label><button class="primary-button" data-bind="click:startRepayment,disable:busy">Send repayment OTP</button></div><div class="otp-row" data-bind="visible:repaymentOrder"><label>OTP<input maxlength="6" data-bind="value:otp"/></label><button class="secondary-button" data-bind="click:resendRepayment,disable:busy">Resend OTP</button><button class="primary-button" data-bind="click:confirmRepayment,disable:busy">Confirm repayment</button></div></section></section>
