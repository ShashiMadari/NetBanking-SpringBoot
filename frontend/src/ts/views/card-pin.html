<section class="page-shell"><div class="page-heading"><div><p class="eyebrow">CARD PIN</p><h1>Change your card PIN.</h1><p class="muted">A six-digit OTP is required to confirm the change.</p></div><a class="secondary-button" href="?ojr=cards">Back to Cards</a></div><div class="alert alert-error" data-bind="visible:error"><span data-bind="text:error"></span></div><div class="alert alert-success" data-bind="visible:notice"><span data-bind="text:notice"></span></div><section class="content-card"><div class="form-row"><label>Credit card<select data-bind="options:cards,optionsText:cardLabel,optionsValue:'cardId',value:selectedCardId"></select></label><label>New four-digit PIN<input type="password" maxlength="4" data-bind="value:newPin"/></label><label>Confirm PIN<input type="password" maxlength="4" data-bind="value:confirmPinValue"/></label><button class="primary-button" data-bind="click:changePin,disable:busy">Send PIN OTP</button></div><div class="otp-row" data-bind="visible:pinOrder"><label>OTP<input maxlength="6" data-bind="value:otp"/></label><button class="secondary-button" data-bind="click:resendPin,disable:busy">Resend OTP</button><button class="primary-button" data-bind="click:confirmPinChange,disable:busy">Confirm PIN</button></div></section></section>
