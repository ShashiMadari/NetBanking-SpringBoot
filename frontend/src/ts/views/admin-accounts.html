<section class="page-shell admin-page admin-detail-page">
  <div class="page-heading admin-heading">
    <div><p class="eyebrow">BANK ADMINISTRATION</p><h1>Account control</h1></div>
    <div class="admin-heading-actions">
      <div class="admin-navigation" data-bind="event: { keydown: adminMenuKeydown }">
        <button type="button" id="admin-navigation-toggle" class="admin-navigation-toggle" aria-label="Admin sections" aria-controls="admin-navigation-list" aria-expanded="false" data-bind="click: toggleAdminMenu, attr: { 'aria-expanded': adminMenuOpen() ? 'true' : 'false' }"><span aria-hidden="true">⋮</span></button>
        <nav id="admin-navigation-list" class="admin-navigation-list" aria-label="Admin sections" style="display:none" data-bind="visible: adminMenuOpen">
          <div data-bind="foreach: adminSections">
            <a data-bind="text: label, attr: { href: $parent.adminSectionLink(id), 'aria-current': $parent.selectedAdminSection() === id ? 'page' : null }"></a>
          </div>
        </nav>
      </div>
      <a class="secondary-button" href="?ojr=admin">Back to admin overview</a>
    </div>
  </div>
  <div class="alert alert-error" data-bind="visible: error"><span data-bind="text: error"></span></div>
  <div class="alert alert-success" data-bind="visible: notice"><span data-bind="text: notice"></span></div>
  <button type="button" class="secondary-button" data-bind="click: loadDashboard, disable: busy"><span data-bind="text: busy() ? 'Refreshing…' : 'Refresh'"></span></button>
  <section id="admin-detail-accounts" class="content-card admin-section">
      <p class="eyebrow">ACCOUNT CONTROL</p><h2 tabindex="-1">Freeze or unfreeze an account</h2>
      <p class="muted">The current backend accepts an account ID and a reason. Customer and account search needs a separate backend endpoint before it can be added here.</p>
      <div class="admin-control-grid">
        <label>Account ID<input type="number" min="1" placeholder="e.g. 101" data-bind="value: accountId" /></label>
        <label>Reason<input placeholder="Reason for this action" data-bind="value: accountReason" /></label>
      </div>
      <div class="form-actions"><button class="primary-button" data-bind="click: () => changeAccountStatus('freeze')">Freeze account</button><button class="secondary-button" data-bind="click: () => changeAccountStatus('unfreeze')">Unfreeze account</button></div>
    </section>
</section>
