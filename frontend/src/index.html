<!-- ************************ IMPORTANT INFORMATION ************************************
  This web navigation drawer template is provided as an example of how to configure
  a JET web application with a navigation drawer as a single page application
  using ojRouter and oj-module.  It contains the Oracle JET framework and a default
  requireJS configuration file to show how JET can be setup in a common application.
  This project template can be used in conjunction with demo code from the JET
  website to test JET component behavior and interactions.

  Any CSS styling with the prefix "demo-" is for demonstration only and is not
  provided as part of the JET framework.

  Please see the demos under Cookbook/Patterns/App Shell: Web and the CSS documentation
  under Support/API Docs/Non-Component Styling on the JET website for more information on how to use
  the best practice patterns shown in this template.

  Aria Landmark role attributes are added to the different sections of the application
  for accessibility compliance. If you change the type of content for a specific
  section from what is defined, you should also change the role value for that
  section to represent the appropriate content type.
  ***************************** IMPORTANT INFORMATION ************************************ -->
<html lang="en-us">
  <head>
    <title>O-Bank | Digital Banking</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <link rel="icon" href="css/images/JET-Favicon-Red-32x32.png" type="image/x-icon" />

    <!-- This is the main css file for the default theme -->
		<!-- injector:theme -->
		<!-- endinjector -->

    <!-- This contains icon fonts used by the starter template -->
		<!-- injector:font -->
		<!-- endinjector:font -->

    <!-- This is where you would add any app specific styling -->
    <link rel="stylesheet" href="css/app.css" type="text/css"/>

  </head>
  <body class="oj-web-applayout-body">
    <!-- Template for rendering navigation items shared between nav bar and nav list -->
    <script type="text/html" id="navTemplate">
      <li><a href="#" :title="[[$data.detail.label]]" :aria-label="[[$data.detail.label]]">
        <span :class="[[$data.detail.iconClass]]" data-bind="visible: !$data.detail.iconSvg"></span>
        <span class="sidebar-module-icon" data-bind="visible: !!$data.detail.iconSvg, html: $data.detail.iconSvg"></span>
        <oj-bind-text value="[[$data.detail.label]]"></oj-bind-text>
      </a></li>
    </script>

    <div id="globalBody">

      <div id="announce" tabindex="-1" class="send-off-screen" :aria-live="[[manner]]" aria-atomic="true">
        <p id="ariaLiveMessage"><oj-bind-text value="[[message]]"></oj-bind-text></p>
      </div>

      <!--
         ** Oracle JET V17.1.0 web application navigation drawer pattern.
         ** Please see the demos under Cookbook/Patterns/App Shell: Web
         ** and the CSS documentation under Support/API Docs/Non-Component Styling
         ** on the JET website for more information on how to use this pattern.
         ** The off-canvas section is used when the browser is resized to a smaller media
         ** query size for a phone format and hidden until a user clicks on
         ** the header hamburger icon.
      -->
      <oj-drawer-popup id="navDrawer" edge="start" opened="{{sideDrawerOn}}"
        modality="modeless" role="navigation"
        class="oj-bg-neutral-170 oj-color-invert"
        on-opened-changed="[[openedChangedHandler]]"
      >
        <oj-navigation-list id="navDrawerList"
                            data="[[navDataProvider]]"                  
                            item.renderer="[[oj.KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                            on-click="[[toggleDrawer]]"
                            selection="{{selection.path}}">
        </oj-navigation-list>
      </oj-drawer-popup>
      <div id="pageContent" class="oj-web-applayout-page"
           data-bind="css: { 'authenticated-layout': signedIn, 'more-menu-open': moreMenuOpen, 'admin-layout': isAdmin }">
        <!--
           ** Oracle JET V17.1.0 web application header pattern.
           ** Please see the demos under Cookbook/Patterns/App Shell: Web
           ** and the CSS documentation under Support/API Docs/Non-Component Styling
           ** on the JET website for more information on how to use this pattern.
        -->
        <header role="banner" class="oj-web-applayout-header">
          <div class="oj-web-applayout-max-width oj-flex-bar oj-sm-align-items-center">
            <!-- Drawer toggle button -->
            <div class="oj-flex-bar-start">
              <oj-button id="drawerToggleButton" class="oj-button-lg" on-oj-action="[[toggleDrawer]]" chroming="borderless" display="icons">
                <span slot="startIcon" class="landing-menu-icon" aria-hidden="true"><span class="menu-line"></span><span class="menu-line"></span><span class="menu-line"></span></span>
                <span>Application Navigation</span>
              </oj-button>
            </div>
            <div class="oj-flex-bar-middle oj-sm-align-items-baseline">
              <!-- ko if: signedIn -->
              <a class="header-brand-link" href="?ojr=dashboard" aria-label="Go to dashboard" data-bind="attr: { href: isAdmin ? '?ojr=admin' : '?ojr=dashboard', 'aria-label': isAdmin ? 'Go to administration overview' : 'Go to dashboard' }">
              <span class="brand-mark" aria-hidden="true">O</span>
              <h1 class="oj-sm-only-hide oj-web-applayout-header-title" title="O-Bank"><oj-bind-text value="[[appName]]"></oj-bind-text></h1>
              </a>
              <!-- /ko -->
              <!-- ko ifnot: signedIn -->
              <div class="landing-brand" aria-label="O-Bank">
                <span class="brand-mark" aria-hidden="true">O</span>
                <h1 class="oj-sm-only-hide oj-web-applayout-header-title" title="O-Bank"><oj-bind-text value="[[appName]]"></oj-bind-text></h1>
              </div>
              <!-- /ko -->
            </div>
            <div class="oj-flex-bar-end" data-bind="visible: signedIn">
              <nav class="header-actions" aria-label="Profile and notifications">
                <a class="header-icon-link notification-bell" href="?ojr=notifications" title="Notifications" aria-label="View notifications" data-bind="attr: { href: isAdmin ? '?ojr=admin-audit' : '?ojr=notifications', title: isAdmin ? 'Audit and notification' : 'Notifications', 'aria-label': isAdmin ? 'View admin audit and notification' : (unreadNotificationCount() > 0 ? 'View notifications, ' + unreadNotificationCount() + ' unread' : 'View notifications') }"><span class="notification-badge" aria-hidden="true" data-bind="visible: unreadNotificationCount() > 0, text: unreadNotificationCount() > 99 ? '99+' : unreadNotificationCount"></span>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
                  </svg>
                </a>
                <a class="header-icon-link" href="?ojr=profile" title="Profile" aria-label="View profile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4" /><path d="M4 21c.8-4.1 3.4-6 8-6s7.2 1.9 8 6" /></svg></a>
              </nav>
            </div>
          </div>
        </header>
        <aside class="obank-sidebar" role="navigation" aria-label="O-Bank navigation"
               data-bind="visible: signedIn">
          <a class="sidebar-brand" href="?ojr=dashboard" aria-label="Go to dashboard" data-bind="attr: { href: isAdmin ? '?ojr=admin' : '?ojr=dashboard', 'aria-label': isAdmin ? 'Go to administration overview' : 'Go to dashboard' }">
            <span class="brand-mark" aria-hidden="true">O</span>
            <span>O-Bank</span>
          </a>
          <p class="sidebar-label">YOUR BANKING</p>
          <oj-navigation-list id="navSidebarList"
                              data="[[sidebarNavDataProvider]]"
                              edge="start"
                              item.renderer="[[oj.KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                              selection="{{selection.path}}">
          </oj-navigation-list>
          <div class="sidebar-more">
            <!-- ko ifnot: isAdmin -->
            <button type="button" class="sidebar-more-toggle" aria-label="Show more banking services"
                    data-bind="click: toggleMoreMenu, attr: { 'aria-expanded': moreMenuOpen }"><span class="menu-line"></span><span class="menu-line"></span><span class="menu-line"></span><span class="send-off-screen">Show banking services</span></button>
            <!-- /ko -->
            <!-- ko if: isAdmin -->
            <button type="button" class="sidebar-more-toggle admin-sidebar-toggle" aria-label="Show admin sections" aria-controls="admin-sidebar-menu"
                    data-bind="click: toggleMoreMenu, attr: { 'aria-expanded': moreMenuOpen }"><span aria-hidden="true">⋮</span></button>
            <!-- /ko -->
            <div class="sidebar-more-menu" data-bind="visible: moreMenuOpen, attr: { id: isAdmin ? 'admin-sidebar-menu' : null }">
              <oj-navigation-list id="navSidebarMoreList"
                                  data="[[moreNavDataProvider]]"
                                  edge="start"
                                  item.renderer="[[oj.KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                                  on-click="[[closeMoreMenu]]"
                                  selection="{{selection.path}}">
              </oj-navigation-list>
            </div>
          </div>
        </aside>
        <oj-module role="main" class="oj-web-applayout-max-width oj-web-applayout-content" config="[[moduleAdapter.koObservableConfig]]">
        </oj-module>
      </div>
    </div>

    <!-- This injects script tags for the main javascript files -->
		<!-- injector:scripts -->
		<!-- endinjector -->

  </body>

</html>
