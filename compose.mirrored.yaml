# Windows WSL mirrored-networking variant. Start with run-mirrored.ps1.
services:
  eureka-server:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-eureka:${IMAGE_TAG:-dev}
    restart: unless-stopped
    network_mode: host
  o-back-identity:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-identity:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
    - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      IDENTITY_BASE_URL: http://localhost:8444
      BANKING_BASE_URL: http://localhost:8445
      APP_BANKING_BASE_URL: http://localhost:8445
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?required}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:?required}
      APP_INTERNAL_API_KEY: ${IDENTITY_API_KEY:?required}
      APP_INTERNAL_BANKING_API_KEY: ${BANKING_API_KEY:?required}
      APP_MAIL_FROM: ${MAIL_USERNAME:?required}
      EUREKA_INSTANCE_HOSTNAME: localhost
    network_mode: host
  o-back-banking:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-banking:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
    - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      IDENTITY_BASE_URL: http://localhost:8444
      BANKING_BASE_URL: http://localhost:8445
      APP_BANKING_BASE_URL: http://localhost:8445
      SPRING_DATASOURCE_PASSWORD: ${BANKING_DB_PASSWORD:?required}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?required}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:?required}
      APP_INTERNAL_IDENTITY_API_KEY: ${IDENTITY_API_KEY:?required}
      APP_INTERNAL_BANKING_API_KEY: ${BANKING_API_KEY:?required}
      EUREKA_INSTANCE_HOSTNAME: localhost
    network_mode: host
  o-bank-credit:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-credit:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
    - eureka-server
    - o-back-banking
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      IDENTITY_BASE_URL: http://localhost:8444
      BANKING_BASE_URL: http://localhost:8445
      APP_BANKING_BASE_URL: http://localhost:8445
      SPRING_DATASOURCE_PASSWORD: ${CREDIT_DB_PASSWORD:?required}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?required}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:?required}
      APP_INTERNAL_IDENTITY_API_KEY: ${IDENTITY_API_KEY:?required}
      APP_INTERNAL_BANKING_API_KEY: ${BANKING_API_KEY:?required}
      EUREKA_INSTANCE_HOSTNAME: localhost
    network_mode: host
  o-bank-forex:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-forex:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
    - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      IDENTITY_BASE_URL: http://localhost:8444
      BANKING_BASE_URL: http://localhost:8445
      APP_BANKING_BASE_URL: http://localhost:8445
      SPRING_DATASOURCE_PASSWORD: ${FOREX_DB_PASSWORD:?required}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?required}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:?required}
      APP_INTERNAL_IDENTITY_API_KEY: ${IDENTITY_API_KEY:?required}
      APP_INTERNAL_BANKING_API_KEY: ${BANKING_API_KEY:?required}
      EUREKA_INSTANCE_HOSTNAME: localhost
    network_mode: host
  o-bank-investment:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-investment:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
    - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      IDENTITY_BASE_URL: http://localhost:8444
      BANKING_BASE_URL: http://localhost:8445
      APP_BANKING_BASE_URL: http://localhost:8445
      EUREKA_INSTANCE_HOSTNAME: localhost
      SPRING_DATASOURCE_PASSWORD: ${INVESTMENT_DB_PASSWORD:?required}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?required}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:?required}
      APP_INTERNAL_IDENTITY_API_KEY: ${IDENTITY_API_KEY:?required}
      APP_INTERNAL_BANKING_API_KEY: ${BANKING_API_KEY:?required}
      APP_INTERNAL_SERVICE_KEY: ${INVESTMENT_SERVICE_KEY:?required}
    network_mode: host
  o-back-gateway:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-gateway:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
    - eureka-server
    - o-back-identity
    - o-back-banking
    - o-bank-credit
    - o-bank-forex
    - o-bank-investment
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_HOSTNAME: localhost
    network_mode: host
  o-bank-frontend:
    image: ${IMAGE_REGISTRY:-localhost}/o-bank-frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
    - o-back-gateway
    network_mode: host
